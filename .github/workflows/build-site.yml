name: Build and publish site

# Builds the Next.js static export in source/ and publishes it to the
# gh-pages branch, which GitHub Pages serves, and keeps the same built files at
# the root of main. Runs on every push to main that changes source/, or
# manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - ".github/workflows/build-site.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: source
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build static site
        working-directory: source
        run: npm run build

      - name: Copy build into gh-pages
        run: rsync -a --exclude .git source/out/ site/

      - name: Publish
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Built site unchanged"
            exit 0
          fi
          git commit -m "Deploy site from ${GITHUB_SHA::7}"
          git push

      - name: Keep a copy of the built site on main
        run: |
          rsync -a source/out/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!source' ':!site'
          if git diff --cached --quiet; then
            echo "main already up to date"
            exit 0
          fi
          git commit -m "Update built site copy from ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Ask GitHub Pages to republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
